<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="An interactive map of design-related resources across New York City."
    />
    <title>Design Resources NYC</title>
    <link
      href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css?v=20260729-2" />
  </head>
  <body>
    <main class="map-shell">
      <header class="project-header">
        <p class="eyebrow">Mapping Systems · Final Project</p>
        <h1>Design Resources NYC</h1>
        <p class="dek">
          An exploratory inventory of where people can learn, experience, make,
          and connect with design in New York City.
        </p>
      </header>

      <aside class="map-panel" aria-label="Map controls">
        <p class="panel-label">Resource layers</p>
        <div class="layer-list">
          <button type="button" data-category="learn">Learn</button>
          <button type="button" data-category="experience">Experience</button>
          <button type="button" data-category="make">Make</button>
          <button type="button" data-category="connect">Connect</button>
        </div>
        <button class="reset-map" id="reset-map" type="button">
          Show all NYC resources
        </button>
        <p class="status" id="map-status">Preparing the map interface.</p>
      </aside>

      <div id="map" aria-label="Interactive map of New York City"></div>
    </main>

    <script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
    <script src="js/map.js?v=20260729-3"></script>
  </body>
</html>
